approvedGitRepositories:
  - "**"

compressionLevel: mixed

defaultSemverRangePrefix: ^

enableGlobalCache: false

enableScripts: false

httpTimeout: 300000

nodeLinker: node-modules

npmMinimalAgeGate: 0

packageExtensions:
  "@module-federation/utilities@*":
    peerDependenciesMeta:
      webpack:
        optional: true
  "@patternfly/react-code-editor@*":
    peerDependencies:
      monaco-editor: ~0.56.0
  eslint-plugin-testing-library@*:
    peerDependencies:
      typescript: ^5.9.3

yarnPath: .yarn/releases/yarn-4.18.1.cjs

npmAlwaysAuth: true

npmAuthIdent: "phantomjinx:c6r1st1n3"

npmPublishRegistry: "http://192.168.88.5:4873"

npmRegistryServer: "http://192.168.88.5:4873"

unsafeHttpWhitelist:
  - localhost
  - 192.168.88.5
